<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RevoGrid Pro filter/source reproduction</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Advanced filter without Infinity Scroll</h1>
      <p>
        Runs a Pro advanced <code>contains "Smolnaya"</code> filter, then
        replaces <code>source</code> with an asynchronously returned server
        result while client-side grouping is active.
      </p>

      <div class="actions">
        <button id="run">Run scenario</button>
        <button id="reset" class="secondary">Reset</button>
      </div>

      <revo-grid id="grid"></revo-grid>

      <h2>Server reload, lifecycle, and store snapshot</h2>
      <pre id="debug">Ready</pre>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
