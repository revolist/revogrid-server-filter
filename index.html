<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RevoGrid Pro remote-filter reproduction</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Infinity scroll + advanced filter</h1>
      <p>
        Runs a Pro advanced <code>contains "Smolnaya"</code> filter. The
        Infinity Scroll plugin cancels local filtering and asks the fake server
        for the matching page.
      </p>

      <div class="actions">
        <button id="run">Run scenario</button>
        <button id="reset" class="secondary">Reset</button>
      </div>

      <revo-grid id="grid"></revo-grid>

      <h2>Remote loads, lifecycle, and store snapshot</h2>
      <pre id="debug">Ready</pre>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
